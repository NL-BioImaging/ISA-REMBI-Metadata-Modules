id: https://w3id.org/mim/profiles/bioimaging/image_analysis
name: mim_bioimaging_image_analysis
title: MIM image analysis
description: Bioimaging analysis process profile.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../../foundation/process
- ../../foundation/software_component
- ../../foundation/data_file
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: image_analysis
  profile: bioimaging
classes:
  MIMImageAnalysisProcessMixin:
    mixin: true
    attributes:
      analysis_software:
        range: MIMSoftwareComponent
        slot_uri: mim:MIMImageAnalysisProcessMixin_analysis_software
        multivalued: true
      segmentation_outputs:
        range: MIMDataFile
        slot_uri: mim:MIMImageAnalysisProcessMixin_segmentation_outputs
        multivalued: true
  MIMImageAnalysisProcess:
    is_a: MIMProcess
    mixins:
    - MIMImageAnalysisProcessMixin
    extra_slots:
      allowed: true

id: https://w3id.org/mim/profiles/bioimaging/imaging_channel
name: mim_bioimaging_imaging_channel
title: MIM imaging channel
description: Bioimaging channel profile component.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../../foundation/common
- ../../foundation/ontology_term
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: imaging_channel
  profile: bioimaging
classes:
  MIMImagingChannel:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      channel_index:
        range: integer
        slot_uri: mim:MIMImagingChannel_channel_index
      visualised_entity:
        range: MIMOntologyTerm
        slot_uri: mim:MIMImagingChannel_visualised_entity
      visualisation_method:
        range: MIMOntologyTerm
        slot_uri: mim:MIMImagingChannel_visualisation_method

id: https://example.org/schemas/profiles/bioimaging/acquisition/imaging_instrument
name: imaging_instrument
title: Imaging instrument
description: Imaging instrument component for microscope and acquisition hardware metadata.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../../jerm/protocol_component
- ../../jerm/parameter
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  ImagingInstrument:
    description: Microscope or imaging instrument used for image acquisition.
    class_uri: schema:Instrument
    extra_slots:
      allowed: true
    attributes:
      instrument_id:
        description: URI, CURIE, local identifier or microscope ID.
        required: false
        range: uriorcurie
        identifier: true
        aliases:
        - Microscope id
        - ImageAcquisition/imaging_instrument
      instrument_name:
        description: Name of the microscope or imaging instrument.
        required: false
        range: string
      instrument_model:
        description: Instrument model.
        required: false
        range: string
      instrument_manufacturer:
        description: Instrument manufacturer.
        required: false
        range: string
      instrument_description:
        description: Description of the imaging instrument.
        required: false
        range: string
      instrument_components:
        description: Hardware/software components of the instrument.
        required: false
        range: ProtocolComponent
        multivalued: true
        inlined: true
        inlined_as_list: true
      instrument_parameters:
        description: Instrument parameters.
        required: false
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: true

id: https://w3id.org/mim/profiles/bioimaging/image_acquisition
name: mim_bioimaging_image_acquisition
title: MIM image acquisition
description: Bioimaging acquisition process profile.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../../foundation/process
- imaging_method
- imaging_instrument
- imaging_channel
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: image_acquisition
  profile: bioimaging
classes:
  MIMImageAcquisitionProcessMixin:
    mixin: true
    attributes:
      imaging_method:
        range: MIMImagingMethod
        slot_uri: mim:MIMImageAcquisitionProcessMixin_imaging_method
      imaging_instrument:
        range: MIMImagingInstrument
        slot_uri: mim:MIMImageAcquisitionProcessMixin_imaging_instrument
      channels:
        range: MIMImagingChannel
        slot_uri: mim:MIMImageAcquisitionProcessMixin_channels
        multivalued: true
  MIMImageAcquisitionProcess:
    is_a: MIMProcess
    mixins:
    - MIMImageAcquisitionProcessMixin
    extra_slots:
      allowed: true

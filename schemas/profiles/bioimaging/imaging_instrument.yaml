id: https://w3id.org/mim/profiles/bioimaging/imaging_instrument
name: mim_bioimaging_imaging_instrument
title: MIM imaging instrument
description: Bioimaging instrument profile component.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../../foundation/hardware_component
- ../../foundation/institution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: imaging_instrument
  profile: bioimaging
classes:
  MIMImagingInstrument:
    is_a: MIMHardwareComponent
    extra_slots:
      allowed: true
    attributes:
      model:
        range: string
        slot_uri: mim:MIMImagingInstrument_model
      manufacturer:
        range: MIMInstitution
        slot_uri: mim:MIMImagingInstrument_manufacturer
      components:
        range: MIMHardwareComponent
        slot_uri: mim:MIMImagingInstrument_components
        multivalued: true

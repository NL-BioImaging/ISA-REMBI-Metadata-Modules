id: https://example.org/schemas/profiles/bioimaging/analysis/segmentation
name: imaging_segmentation
title: Imaging segmentation
description: Image segmentation metadata for describing segmentation approaches and outputs.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../../jerm/protocol
- ../../jerm/data
- ../../jerm/parameter
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  ImagingSegmentation:
    description: Segmentation method or output used in image analysis.
    extra_slots:
      allowed: true
    attributes:
      segmentation_id:
        description: URI or CURIE identifier for the segmentation.
        required: false
        range: uriorcurie
        identifier: true
      segmentation_name:
        description: Segmentation method or output name.
        required: false
        range: string
      segmentation_description:
        description: Description of the segmentation method or result.
        required: false
        range: string
      segmentation_protocol:
        description: Protocol used for segmentation.
        required: false
        range: Protocol
        inlined: true
      segmentation_parameters:
        description: Segmentation parameters.
        required: false
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      segmentation_output:
        description: Segmentation output data.
        required: false
        range: Data
        inlined: true

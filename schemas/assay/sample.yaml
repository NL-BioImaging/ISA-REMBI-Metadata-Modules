id: https://example.org/schemas/assay/sample
name: sample
title: JERM sample
description: Generic sample component aligned with JERM/ISA sample and extensible for BioSamples/BIA specimens.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- material
- source
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Sample:
    description: Sample material used as input or output of an assay or process.
    is_a: Material
    class_uri: isa:sample
    extra_slots:
      allowed: true
    attributes:
      sample_id:
        description: URI or CURIE identifier for the sample.
        required: false
        range: uriorcurie
        identifier: true
      sample_name:
        description: Sample name.
        required: false
        range: string
      sample_description:
        description: Sample description.
        required: false
        range: string
      source:
        description: Source material from which the sample was derived.
        required: false
        range: Source
      sample_material:
        description: Sample material description.
        required: false
        range: Material
        inlined: true

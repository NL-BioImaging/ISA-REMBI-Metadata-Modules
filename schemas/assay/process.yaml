id: https://example.org/schemas/assay/process
name: process
title: JERM process
description: Process component linking input material/data, output material/data, protocol, performer, date and parameters.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- material
- data
- protocol
- parameter
- agents/person
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Process:
    description: Event or process that consumes inputs and produces outputs following a protocol.
    extra_slots:
      allowed: true
    attributes:
      process_id:
        description: URI or CURIE identifier for the process.
        required: false
        range: uriorcurie
        identifier: true
      process_name:
        description: Process name.
        required: false
        range: string
      process_description:
        description: Process description.
        required: false
        range: string
      input_materials:
        description: Materials used as process input.
        required: false
        range: Material
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - valid input material
        - sample input material
        - source material
      input_data:
        description: Data used as process input.
        required: false
        range: Data
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - data input
      output_materials:
        description: Materials produced by the process.
        required: false
        range: Material
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - valid output material
        - sample output material
      output_data:
        description: Data produced by the process.
        required: false
        range: Data
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - data output
      protocol:
        description: Protocol followed by the process.
        required: false
        range: Protocol
        inlined: true
      performers:
        description: Persons who performed the process.
        required: false
        range: Person
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - Performer
      process_date:
        description: Date on which the process was performed.
        required: false
        range: date
        aliases:
        - Date
      parameter_values:
        description: Parameter values recorded for the process.
        required: false
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - Parameter Value[...]

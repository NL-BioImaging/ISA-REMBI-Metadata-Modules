id: https://example.org/schemas/assay/parameter
name: parameter
title: JERM parameter
description: Parameter and parameter-value component for protocols and processes.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../shared/mixins/common
- ../shared/ontology/ontology_annotation
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Parameter:
    description: Parameter definition or value used by a protocol or process.
    class_uri: isa:parameter
    extra_slots:
      allowed: true
    attributes:
      parameter_id:
        description: URI or CURIE identifier for the parameter.
        required: false
        range: uriorcurie
        identifier: true
      parameter_name:
        description: Parameter name.
        required: false
        range: string
        aliases:
        - parameter
      parameter_value:
        description: Parameter value.
        required: false
        range: string
        aliases:
        - Parameter Value[...]
      parameter_unit:
        description: Unit for the parameter value.
        required: false
        range: string
      parameter_term:
        description: Ontology annotation for the parameter.
        required: false
        range: SharedOntologyAnnotation
        inlined: true

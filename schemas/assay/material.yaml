id: https://example.org/schemas/assay/material
name: material
title: JERM material
description: Generic material component for physical inputs and outputs in processes.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../shared/mixins/common
- ../shared/ontology/ontology_annotation
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Material:
    description: Generic physical material used as input or output of a process.
    class_uri: isa:material
    extra_slots:
      allowed: true
    attributes:
      material_id:
        description: URI or CURIE identifier for the material.
        required: false
        range: uriorcurie
        identifier: true
      material_name:
        description: Name of the material.
        required: false
        range: string
      material_description:
        description: Description of the material.
        required: false
        range: string
      material_type:
        description: Ontology annotation describing the material type.
        required: false
        range: SharedOntologyAnnotation
        inlined: true

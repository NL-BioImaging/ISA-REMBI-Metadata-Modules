id: https://example.org/schemas/assay/assay_overview
name: assay
title: JERM assay
description: Assay component aligned with JERM/ISA assay, REMBI study component, and MIHCSME assay fields.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- process
- protocol
- material
- data
- measurement
- agents/person
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Assay:
    description: Assay within a study, with materials, protocols, processes, data and measurements.
    extra_slots:
      allowed: true
    attributes:
      assay_id:
        description: URI or CURIE identifier for the assay.
        required: false
        range: uriorcurie
        identifier: true
        aliases:
        - Assay internal ID
      assay_title:
        description: Assay title.
        required: true
        range: string
        aliases:
        - Assay Title
      assay_description:
        description: Assay description.
        required: false
        range: string
        aliases:
        - Assay Description
      assay_number_of_biological_replicates:
        description: Number of biological replicates in the assay.
        required: false
        range: integer
        aliases:
        - Assay number of biological replicates
      number_of_plates:
        description: Number of plates used in the assay.
        required: false
        range: integer
        aliases:
        - Number of plates
      assay_technology_type:
        description: Technology type used by the assay.
        required: false
        range: string
        aliases:
        - Assay Technology Type
      assay_type:
        description: Assay type.
        required: false
        range: string
        aliases:
        - Assay Type
      assay_external_url:
        description: External URL for the assay.
        required: false
        range: uri
        aliases:
        - Assay External URL
      assay_data_url:
        description: URL for assay data.
        required: false
        range: uri
        aliases:
        - Assay data URL
      materials:
        description: Materials associated with the assay.
        required: false
        range: Material
        multivalued: true
        inlined: true
        inlined_as_list: true
      data:
        description: Data associated with the assay.
        required: false
        range: Data
        multivalued: true
        inlined: true
        inlined_as_list: true
      protocols:
        description: Protocols used in the assay.
        required: false
        range: Protocol
        multivalued: true
        inlined: true
        inlined_as_list: true
      processes:
        description: Processes performed in the assay.
        required: false
        range: Process
        multivalued: true
        inlined: true
        inlined_as_list: true
      measurements:
        description: Measurements made in the assay.
        required: false
        range: Measurement
        multivalued: true
        inlined: true
        inlined_as_list: true

id: https://example.org/schemas/assay/source
name: source
title: JERM source material
description: Source material component aligned with ISA source and BIA biological inputs.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- material
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Source:
    description: Source material used to generate samples or specimens.
    is_a: Material
    class_uri: isa:source
    extra_slots:
      allowed: true
    attributes:
      source_id:
        description: URI or CURIE identifier for the source material.
        required: false
        range: uriorcurie
        identifier: true
      source_name:
        description: Source material name.
        required: false
        range: string
      source_description:
        description: Description of the source material.
        required: false
        range: string
      source_material:
        description: Underlying material reference.
        required: false
        range: Material
        inlined: true

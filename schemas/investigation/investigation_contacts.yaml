id: https://example.org/schemas/investigation/investigation_contacts
name: investigation_contacts_schema
description: Investigation contacts metadata attachment module
version: v1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
  - linkml:types
  - ../../shared/agents/person
  - ../../shared/agents/organisation
default_range: string

prefixes:
  orcid: https://orcid.org/

created_by: orcid:0000-0002-4904-3269

annotations:
  annotation_group: Investigation
  module_name: contacts
  semantic_scope: Investigation contact attachment module
  profile_origin: MIHCSME
  metadata_profile_source: MIHCSME + JERM/SEEK + ISA
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC ; ACDC
  maintainer_note: Contact attachment module referencing shared Person and Organisation classes

classes:
  InvestigationContacts:
    description: Contact attachment metadata for the Investigation annotation group
    slots:
      - contacts
      - data_owner_references
      - collaborator_references
      - organisation_references

slots:
  contacts:
    description: Contacts associated with the investigation
    required: false
    multivalued: true
    range: Person
    aliases:
      - contacts

  data_owner_references:
    description: References to contacts acting as data owners
    required: false
    multivalued: true
    range: Person
    aliases:
      - DataOwner

  collaborator_references:
    description: References to contacts acting as data collaborators
    required: false
    multivalued: true
    range: Person
    aliases:
      - DataCollaborator

  organisation_references:
    description: References to organisations associated with the investigation contacts
    required: false
    multivalued: true
    range: Organisation
    aliases:
      - organisations
      - institutions

id: https://example.org/schemas/investigation/investigation_overview
name: investigation
title: JERM investigation
description: Investigation component aligned with JERM/ISA investigation and MIHCSME investigation fields.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../project
- ../study
- ../shared/references/publication
- ../shared/agents/person
- agents/organisation
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Investigation:
    description: Investigation grouping studies, publications, contacts and project information.
    class_uri: isa:investigation
    tree_root: true
    extra_slots:
      allowed: true
    attributes:
      investigation_id:
        description: URI or CURIE identifier for the investigation.
        required: false
        range: uriorcurie
        identifier: true
        aliases:
        - Investigation internal ID
        - investigation internal ID
      project_id:
        description: Project identifier.
        required: false
        range: string
        aliases:
        - Project ID
      investigation_title:
        description: Investigation title.
        required: true
        range: string
        aliases:
        - Investigation Title
      investigation_description:
        description: Investigation description.
        required: false
        range: string
        aliases:
        - Investigation description
      project:
        description: Project associated with the investigation.
        required: false
        range: Project
        inlined: true
      contacts:
        description: Contacts represented as person, organisation and role records.
        required: false
        range: Person
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - DataOwner
        - DataCollaborator
        - Contact
      organisations:
        description: Organisations associated with the investigation.
        required: false
        range: Organisation
        multivalued: true
        inlined: true
        inlined_as_list: true
      publications:
        description: Publications associated with the investigation.
        required: false
        range: Publication
        multivalued: true
      studies:
        description: Studies included in the investigation.
        required: false
        range: Study
        multivalued: true
        inlined: true
        inlined_as_list: true

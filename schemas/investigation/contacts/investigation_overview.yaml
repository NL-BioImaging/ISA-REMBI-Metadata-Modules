id: https://example.org/schemas/investigation/investigation_overview
name: investigation_overview_schema
description: Investigation overview metadata module
version: v1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
  - linkml:types
default_range: string

prefixes:
  orcid: https://orcid.org/

created_by: orcid:0000-0002-4904-3269

annotations:
  annotation_group: Investigation
  module_name: overview
  semantic_scope: ISA Investigation
  profile_origin: MIHCSME
  metadata_profile_source: JERM/SEEK + ISA
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC ; ACDC
  maintainer_note: Initial draft for modular bioimaging metadata schema

classes:

  InvestigationOverview:
    description: Overview metadata for the Investigation annotation group
    slots:
      - investigation_identifier
      - project_references
      - investigation_title
      - investigation_description
      - other_creators
      - sharing_policy
      - investigation_submission_date
      - investigation_public_release_date
      - contact_references
      - publication_references

slots:

  investigation_identifier:
    description: Identifier of the investigation
    required: false
    aliases:
      - Investigation Identifier
      - Investigation internal ID

  project_references:
    description: References to projects associated with the investigation
    required: false
    multivalued: true

  investigation_title:
    description: Title of the investigation
    required: true
    aliases:
      - Investigation Title

  investigation_description:
    description: Free-text description of the investigation
    required: false
    multiline: true
    aliases:
      - Investigation description

  other_creators:
    description: Other creators of the investigation
    required: false
    multivalued: true

  sharing_policy:
    description: Sharing policy associated with the investigation
    required: false

  investigation_submission_date:
    description: Date on which the investigation was reported or submitted
    required: false
    range: date
    aliases:
      - Investigation Submission Date

  investigation_public_release_date:
    description: Date on which the investigation was publicly released
    required: false
    range: date
    aliases:
      - Investigation Public Release Date

  contact_references:
    description: References to contacts associated with the investigation
    required: false
    multivalued: true

  publication_references:
    description: References to publications associated with the investigation
    required: false
    multivalued: true
id: https://example.org/schemas/study/factor
name: factor
description: Factor component for study or assay variables.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../shared/mixins/common
- ../shared/ontology/ontology_annotation
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Factor:
    description: Factor or variable used in a study or assay design.
    class_uri: isa:factor
    extra_slots:
      allowed: true
    attributes:
      factor_id:
        description: URI or CURIE identifier for the factor.
        required: false
        range: uriorcurie
        identifier: true
      factor_name:
        description: Factor name.
        required: false
        range: string
      factor_type:
        description: Factor type as ontology annotation.
        required: false
        range: SharedOntologyAnnotation
        inlined: true
      factor_value:
        description: Factor value.
        required: false
        range: string

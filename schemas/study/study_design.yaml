id: https://example.org/schemas/study/study_design
name: study_design
description: Study design component for design type and factors.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- factor
- ../shared/ontology/ontology_annotation
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  StudyDesign:
    description: Study design or experimental design description.
    extra_slots:
      allowed: true
    attributes:
      study_design_id:
        description: URI or CURIE identifier for the design.
        required: false
        range: uriorcurie
        identifier: true
      study_design_type:
        description: Ontology annotation describing the design type.
        required: false
        range: SharedOntologyAnnotation
        inlined: true
      study_design_description:
        description: Description of the study design.
        required: false
        range: string
      factors:
        description: Factors included in the study design.
        required: false
        range: Factor
        multivalued: true
        inlined: true
        inlined_as_list: true

id: https://w3id.org/mim/core/value
name: mim_core_value
title: MIM value
description: Abstract type-designated value.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: value
  profile: core
classes:
  MIMValue:
    mixins:
    - MIMIdentifiedMixin
    abstract: true
    extra_slots:
      allowed: true
    attributes:
      value_type:
        range: string
        slot_uri: mim:MIMValue_value_type
        designates_type: true
        required: true
      unit:
        range: MIMOntologyTerm
        slot_uri: mim:MIMValue_unit

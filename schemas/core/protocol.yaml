id: https://w3id.org/mim/core/protocol
name: mim_core_protocol
title: MIM protocol
description: Reusable protocol description.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
- protocol_component
- parameter_specification
- attribution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: protocol
  profile: core
classes:
  MIMProtocol:
    class_uri: jerm:Protocol
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      protocol_type:
        range: MIMOntologyTerm
        slot_uri: mim:MIMProtocol_protocol_type
      components:
        range: MIMProtocolComponent
        slot_uri: mim:MIMProtocol_components
        multivalued: true
      parameters:
        range: MIMParameterSpecification
        slot_uri: mim:MIMProtocol_parameters
        multivalued: true
      protocol_url:
        range: uri
        slot_uri: mim:MIMProtocol_protocol_url
      attribution:
        range: MIMAttribution
        slot_uri: mim:MIMProtocol_attribution
        inlined: true

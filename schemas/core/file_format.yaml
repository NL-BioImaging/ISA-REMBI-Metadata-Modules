id: https://w3id.org/mim/core/file_format
name: mim_core_file_format
title: MIM file format
description: Digital file format separated from file identity.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: file_format
  profile: core
classes:
  MIMFileFormat:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      media_type:
        range: string
        slot_uri: mim:MIMFileFormat_media_type
      file_extension:
        range: string
        slot_uri: mim:MIMFileFormat_file_extension
        multivalued: true
      format_term:
        range: MIMOntologyTerm
        slot_uri: mim:MIMFileFormat_format_term

id: https://w3id.org/mim/core/institution
name: mim_core_institution
title: MIM institution
description: Institution participating in a project or attribution.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: institution
  profile: core
classes:
  MIMInstitution:
    class_uri: jerm:Institution
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      ror:
        range: uriorcurie
        slot_uri: mim:MIMInstitution_ror
      address:
        range: string
        slot_uri: mim:MIMInstitution_address
      web_page:
        range: uri
        slot_uri: mim:MIMInstitution_web_page

id: https://w3id.org/mim/core/common
name: mim_core_common
title: MIM common mixins
description: Shared local mixins for identified, named, and described JERM-aligned
  objects.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: common
  profile: core
classes:
  MIMIdentifiedMixin:
    mixin: true
    attributes:
      id:
        range: uriorcurie
        slot_uri: mim:MIMIdentifiedMixin_id
        identifier: true
        required: true
  MIMNamedMixin:
    mixin: true
    attributes:
      title:
        range: string
        slot_uri: mim:MIMNamedMixin_title
  MIMDescribedMixin:
    mixin: true
    attributes:
      description:
        range: string
        slot_uri: mim:MIMDescribedMixin_description

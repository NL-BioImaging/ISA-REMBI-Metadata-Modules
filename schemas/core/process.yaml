id: https://w3id.org/mim/core/process
name: mim_core_process
title: MIM process
description: Execution record linking protocol, people, inputs, outputs, parameters,
  and measurements.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- protocol
- person
- material
- data_file
- parameter_value
- measurement
- attribution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: process
  profile: core
classes:
  MIMProcess:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      protocol:
        range: MIMProtocol
        slot_uri: mim:MIMProcess_protocol
      performers:
        range: MIMPerson
        slot_uri: mim:MIMProcess_performers
        multivalued: true
      performed_on:
        range: datetime
        slot_uri: mim:MIMProcess_performed_on
      input_materials:
        range: MIMMaterial
        slot_uri: mim:MIMProcess_input_materials
        multivalued: true
      output_materials:
        range: MIMMaterial
        slot_uri: mim:MIMProcess_output_materials
        multivalued: true
      input_data:
        range: MIMDataFile
        slot_uri: mim:MIMProcess_input_data
        multivalued: true
      output_data:
        range: MIMDataFile
        slot_uri: mim:MIMProcess_output_data
        multivalued: true
      parameter_values:
        range: MIMParameterValue
        slot_uri: mim:MIMProcess_parameter_values
        multivalued: true
        inlined: true
      measurements:
        range: MIMMeasurement
        slot_uri: mim:MIMProcess_measurements
        multivalued: true
        inlined: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:MIMProcess_attribution
        inlined: true

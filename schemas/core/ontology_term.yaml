id: https://w3id.org/mim/core/ontology_term
name: mim_core_ontology_term
title: MIM ontology term
description: Ontology-backed concept annotation.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_source
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: ontology_term
  profile: core
classes:
  MIMOntologyTerm:
    mixins:
    - MIMIdentifiedMixin
    extra_slots:
      allowed: true
    attributes:
      label:
        range: string
        slot_uri: mim:MIMOntologyTerm_label
        required: true
      source:
        range: MIMOntologySource
        slot_uri: mim:MIMOntologyTerm_source

id: https://w3id.org/mim/core/investigation
name: mim_core_investigation
title: MIM investigation
description: JERM-aligned investigation grouping studies.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- study
- person
- publication
- funding
- attribution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: investigation
  profile: core
classes:
  MIMInvestigation:
    class_uri: jerm:Investigation
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      studies:
        range: MIMStudy
        slot_uri: mim:MIMInvestigation_studies
        multivalued: true
      publications:
        range: MIMPublication
        slot_uri: mim:MIMInvestigation_publications
        multivalued: true
      funding:
        range: MIMFunding
        slot_uri: mim:MIMInvestigation_funding
        multivalued: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:MIMInvestigation_attribution
        inlined: true

id: https://w3id.org/mim/core/study_design
name: mim_core_study_design
title: MIM study design
description: Study-design description and factors.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
- factor
- attribution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: study_design
  profile: core
classes:
  MIMStudyDesign:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      design_type:
        range: MIMOntologyTerm
        slot_uri: mim:MIMStudyDesign_design_type
      factors:
        range: MIMFactor
        slot_uri: mim:MIMStudyDesign_factors
        multivalued: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:MIMStudyDesign_attribution
        inlined: true

id: https://w3id.org/mim/core/data_file
name: mim_core_data_file
title: MIM data file
description: Identifiable digital data file.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- research_asset
- file_format
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: data_file
  profile: core
classes:
  MIMDataFile:
    class_uri: jerm:Data
    is_a: MIMResearchAsset
    extra_slots:
      allowed: true
    attributes:
      location:
        range: uri
        slot_uri: mim:MIMDataFile_location
      file_format:
        range: MIMFileFormat
        slot_uri: mim:MIMDataFile_file_format
      checksum:
        range: string
        slot_uri: mim:MIMDataFile_checksum

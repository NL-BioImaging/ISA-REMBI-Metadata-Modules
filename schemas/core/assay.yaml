id: https://w3id.org/mim/core/assay
name: mim_core_assay
title: MIM assay
description: JERM-aligned assay linked to study, processes, samples, and assets.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
- process
- sample
- research_asset
- attribution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: assay
  profile: core
classes:
  MIMAssay:
    class_uri: jerm:Assay
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      assay_type:
        range: MIMOntologyTerm
        slot_uri: mim:MIMAssay_assay_type
      technology_type:
        range: MIMOntologyTerm
        slot_uri: mim:MIMAssay_technology_type
      processes:
        range: MIMProcess
        slot_uri: mim:MIMAssay_processes
        multivalued: true
      samples:
        range: MIMSample
        slot_uri: mim:MIMAssay_samples
        multivalued: true
      assets:
        range: MIMResearchAsset
        slot_uri: mim:MIMAssay_assets
        multivalued: true
      study_reference:
        range: uriorcurie
        slot_uri: mim:MIMAssay_study_reference
      attribution:
        range: MIMAttribution
        slot_uri: mim:MIMAssay_attribution
        inlined: true

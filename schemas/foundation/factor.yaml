id: https://w3id.org/mim/schemas/foundation/factor
name: mim_foundation_factor
title: MIM factor
description: Study-design factor.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- ontology_term
- attribution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: factor
  profile: foundation

classes:
  MIMFactor:
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
      broad_mapping: jerm:Experimental_factor
      related_mapping: jerm:Factors_studied
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      factor_type:
        range: MIMOntologyTerm
        slot_uri: mim:Factor_factor_type
      attribution:
        range: MIMAttribution
        slot_uri: mim:Factor_attribution
        inlined: true

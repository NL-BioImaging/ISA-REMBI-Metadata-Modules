id: https://w3id.org/mim/schemas/foundation/sop
name: mim_foundation_sop
title: MIM SOP
description: SOP research asset linked to a protocol.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- protocol
- file_format
- factor
- assay
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: sop
  profile: foundation

classes:
  MIMSOP:
    class_uri: jerm:SOP
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    is_a: MIMProtocol
    slot_usage:
      asset_type:
        equals_string: sop
    extra_slots:
      allowed: true
    attributes:
      format:
        range: MIMFileFormat
        slot_uri: jerm:hasFormat
        annotations:
          jerm_range: jerm:SOP_file_format
          mim_range_adaptation: MIMFileFormat
      factors_studied:
        range: MIMFactor
        slot_uri: jerm:hasPart
        multivalued: true
        annotations:
          jerm_range: jerm:Factors_studied
          mim_range_adaptation: MIMFactor
      assay:
        range: MIMAssay
        slot_uri: jerm:isPartOf
        annotations:
          jerm_range: jerm:Assay

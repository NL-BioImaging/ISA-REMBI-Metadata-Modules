id: https://w3id.org/mim/foundation/person
name: mim_foundation_person
title: MIM person
description: Person participating in JERM-aligned metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- institution
- role
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: person
  profile: foundation
classes:
  MIMAgent:
    class_uri: jerm:Person
    mixins:
    - MIMIdentifiedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      given_name:
        range: string
        slot_uri: mim:MIMAgent_given_name
      middle_name:
        range: string
        slot_uri: mim:MIMAgent_middle_name
      family_name:
        range: string
        slot_uri: mim:MIMAgent_family_name
        required: true
      orcid:
        range: uriorcurie
        slot_uri: mim:MIMAgent_orcid
      email:
        range: string
        slot_uri: mim:MIMAgent_email
      affiliations:
        range: MIMInstitution
        slot_uri: mim:MIMAgent_affiliations
        multivalued: true
      roles:
        range: MIMRole
        slot_uri: mim:MIMAgent_roles
        multivalued: true
        required: true

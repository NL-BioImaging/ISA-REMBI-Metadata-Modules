id: https://w3id.org/mim/foundation/external_reference
name: mim_foundation_external_reference
title: MIM external reference
description: Typed resolvable external reference.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: external_reference
  profile: foundation
classes:
  MIMExternalReference:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      reference_type:
        range: MIMOntologyTerm
        slot_uri: mim:MIMExternalReference_reference_type
      resolves_to:
        range: uri
        slot_uri: mim:MIMExternalReference_resolves_to
        required: true

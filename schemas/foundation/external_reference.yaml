id: https://w3id.org/mim/schemas/foundation/external_reference
name: mim_foundation_external_reference
title: MIM external reference
description: Typed resolvable external reference.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: external_reference
  profile: foundation

classes:
  MIMExternalReference:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      reference_type:
        range: MIMOntologyTerm #check whether the reference type is an ontology term
        slot_uri: mim:ExternalReference_reference_type

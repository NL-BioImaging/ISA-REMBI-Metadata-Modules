id: https://w3id.org/mim/schemas/foundation/value
name: mim_foundation_value
title: MIM value
description: Abstract type-designated value.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: value
  profile: foundation

classes:
  MIMValue:
    mixins:
    - MIMIdentifiedMixin
    abstract: true
    extra_slots:
      allowed: true
    attributes:
      value_type:
        range: MIMValueTypeEnum
        slot_uri: mim:Value_value_type
        designates_type: true
        required: true
      unit: # Actual Observed Unit (recorded data)
        range: MIMOntologyTerm
        slot_uri: mim:Value_unit

enums:
  MIMValueTypeEnum:
    permissible_values:
      MIMQuantityValue:
      MIMCategoricalValue:
      MIMDateValue:
      MIMTextValue:
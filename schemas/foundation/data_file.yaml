id: https://w3id.org/mim/schemas/foundation/data_file
name: mim_foundation_data_file
title: MIM data file
description: Identifiable digital data file.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- asset
- file_format
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: data_file
  profile: foundation

classes:
  MIMDataFile:
    class_uri: jerm:Data
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    is_a: MIMAsset
    slot_usage:
      asset_type:
        equals_string: MIMDataFile
    extra_slots:
      allowed: true
    attributes:
      location:
        range: uri
        slot_uri: mim:DataFile_location
      file_format:
        range: MIMFileFormat
        slot_uri: jerm:hasFormat
        annotations:
          jerm_range: jerm:Data_file_format
          mim_range_adaptation: MIMFileFormat
      checksum:
        range: string
        slot_uri: mim:DataFile_checksum

id: https://w3id.org/mim/foundation/sample_characteristic_definition
name: mim_foundation_sample_characteristic_definition
title: MIM sample characteristic definition
description: Definition of a biological sample characteristic.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: sample_characteristic_definition
  profile: foundation
classes:
  MIMSampleCharacteristicDefinition:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      characteristic_term:
        range: MIMOntologyTerm
        slot_uri: mim:MIMSampleCharacteristicDefinition_characteristic_term
      unit:
        range: MIMOntologyTerm
        slot_uri: mim:MIMSampleCharacteristicDefinition_unit

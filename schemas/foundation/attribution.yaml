id: https://w3id.org/mim/schemas/foundation/attribution
name: mim_foundation_attribution
title: MIM attribution
description: Structured creators, responsible institutions, and lifecycle metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- agent
- institution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: attribution
  profile: foundation

classes:
  MIMAttribution:
    mixins:
    - MIMIdentifiedMixin
    extra_slots:
      allowed: true
    attributes:
      creators:
        range: MIMAgent
        slot_uri: mim:Attribution_creators
        multivalued: true
      responsible_institutions:
        range: MIMInstitution
        slot_uri: mim:Attribution_responsible_institutions
        multivalued: true
      created_on:
        range: datetime
        slot_uri: mim:Attribution_created_on
      modified_on:
        range: datetime
        slot_uri: mim:Attribution_modified_on

id: https://w3id.org/mim/foundation/attribution
name: mim_foundation_attribution
title: MIM attribution
description: Structured creators, contributors, institutions, roles, and lifecycle
  metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- person
- institution
- role
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: attribution
  profile: foundation
classes:
  MIMAttribution:
    mixins:
    - MIMIdentifiedMixin
    extra_slots:
      allowed: true
    attributes:
      creators:
        range: MIMPerson
        slot_uri: mim:MIMAttribution_creators
        multivalued: true
      contributors:
        range: MIMPerson
        slot_uri: mim:MIMAttribution_contributors
        multivalued: true
      responsible_institutions:
        range: MIMInstitution
        slot_uri: mim:MIMAttribution_responsible_institutions
        multivalued: true
      roles:
        range: MIMRole
        slot_uri: mim:MIMAttribution_roles
        multivalued: true
      created_on:
        range: datetime
        slot_uri: mim:MIMAttribution_created_on
      modified_on:
        range: datetime
        slot_uri: mim:MIMAttribution_modified_on

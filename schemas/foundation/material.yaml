id: https://w3id.org/mim/schemas/foundation/material
name: mim_foundation_material
title: MIM material
description: Abstract biological or experimental material.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- ontology_term
- attribution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: material
  profile: foundation

classes:
  MIMMaterial:
    class_uri: jerm:Material_entity
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    abstract: true
    extra_slots:
      allowed: true
    attributes:
      material_type:
        range: MIMOntologyTerm
        slot_uri: mim:Material_material_type
      attribution:
        range: MIMAttribution
        slot_uri: mim:Material_attribution
        inlined: true

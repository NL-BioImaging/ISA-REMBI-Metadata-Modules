id: https://w3id.org/mim/schemas/foundation/presentation
name: mim_foundation_presentation
title: MIM presentation
description: Presentation research asset.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- asset
- data_file
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: presentation
  profile: foundation

classes:
  MIMPresentation:
    is_a: MIMAsset
    slot_usage:
      asset_type:
        equals_string: MIMPresentation
    extra_slots:
      allowed: true
    attributes:
      file:
        range: MIMDataFile
        slot_uri: mim:Presentation_file

id: https://w3id.org/mim/foundation/funding
name: mim_foundation_funding
title: MIM funding
description: Funding record composed of grant references.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- institution
- grant_reference
- attribution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: funding
  profile: foundation
classes:
  MIMFunding:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      funder:
        range: MIMInstitution
        slot_uri: mim:MIMFunding_funder
      grant_references:
        range: MIMGrantReference
        slot_uri: mim:MIMFunding_grant_references
        multivalued: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:MIMFunding_attribution
        inlined: true

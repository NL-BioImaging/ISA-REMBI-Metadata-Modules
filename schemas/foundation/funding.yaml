id: https://w3id.org/mim/schemas/foundation/funding
name: mim_foundation_funding
title: MIM funding
description: Structured grant or funding-award record.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- institution
- attribution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: funding
  profile: foundation

classes:
  MIMFunding:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      funder:
        range: MIMInstitution
        slot_uri: mim:Funding_funder
        inlined: true
      award_number:
        range: string
        slot_uri: mim:Funding_award_number
      award_url:
        range: uri
        slot_uri: mim:Funding_award_url
      attribution:
        range: MIMAttribution
        slot_uri: mim:Funding_attribution
        inlined: true

id: https://w3id.org/mim/schemas/foundation/strain
name: mim_foundation_strain
title: MIM strain
description: Strain metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- organism
- ontology_term
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: strain
  profile: foundation

classes:
  MIMStrain:
    class_uri: jerm:Strain
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    - MIMCommentedMixin
    extra_slots:
      allowed: true
    attributes:
      organism:
        range: MIMOrganism
        slot_uri: mim:Strain_organism
        required: true
      phenotype:
        range: MIMOntologyTerm
        slot_uri: mim:Strain_phenotype
      genotype:
        range: MIMOntologyTerm
        slot_uri: mim:Strain_genotype

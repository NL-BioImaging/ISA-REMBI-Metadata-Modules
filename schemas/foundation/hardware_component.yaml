id: https://w3id.org/mim/schemas/foundation/hardware_component
name: mim_foundation_hardware_component
title: MIM hardware component
description: Hardware Component subtype.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- protocol_component
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: hardware_component
  profile: foundation

classes:
  MIMHardwareComponent:
    is_a: MIMProtocolComponent
    extra_slots:
      allowed: true
    attributes:
      component_type:
        equals_string: "hardware"
      manufacturer:
        range: string
        slot_uri: mim:HardwareComponent_manufacturer
      model_number:
        range: string
        slot_uri: mim:HardwareComponent_model_number

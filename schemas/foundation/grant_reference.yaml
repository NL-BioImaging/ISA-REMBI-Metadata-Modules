id: https://w3id.org/mim/foundation/grant_reference
name: mim_foundation_grant_reference
title: MIM grant reference
description: Structured grant or funding-award reference.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- institution
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: grant_reference
  profile: foundation
classes:
  MIMGrantReference:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      funder:
        range: MIMInstitution
        slot_uri: mim:MIMGrantReference_funder
      award_number:
        range: string
        slot_uri: mim:MIMGrantReference_award_number
      award_url:
        range: uri
        slot_uri: mim:MIMGrantReference_award_url

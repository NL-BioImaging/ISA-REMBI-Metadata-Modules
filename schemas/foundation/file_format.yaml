id: https://w3id.org/mim/schemas/foundation/file_format
name: mim_foundation_file_format
title: MIM file format
description: Digital file format separated from file identity.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/
  
imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: file_format
  profile: foundation

classes:
  MIMFileFormat:
    class_uri: jerm:Format
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      media_type:
        range: string
        slot_uri: mim:FileFormat_media_type
      file_extension:
        range: string
        slot_uri: mim:FileFormat_file_extension
        multivalued: true
      format_term:
        range: MIMOntologyTerm
        slot_uri: mim:FileFormat_format_term

id: https://w3id.org/mim/foundation/ontology_source
name: mim_foundation_ontology_source
title: MIM ontology source
description: Ontology or controlled-vocabulary release metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: ontology_source
  profile: foundation
classes:
  MIMOntologySource:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      version:
        range: string
        slot_uri: mim:MIMOntologySource_version
      release_date:
        range: date
        slot_uri: mim:MIMOntologySource_release_date
      homepage:
        range: uri
        slot_uri: mim:MIMOntologySource_homepage

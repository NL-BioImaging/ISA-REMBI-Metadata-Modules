id: https://w3id.org/mim/schemas/foundation/ontology_source
name: mim_foundation_ontology_source
title: MIM ontology source
description: Ontology or controlled-vocabulary release metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
  - linkml:types
  - common

default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: ontology_source
  profile: foundation

classes:
  MIMOntologySource:
    description: Identifiable ontology or controlled-vocabulary release.
    mixins:
      - MIMIdentifiedMixin
      - MIMNamedMixin
      - MIMDescribedMixin
      - MIMVersionedMixin
    extra_slots:
      allowed: true
    attributes:
      release_date:
        description: Release date of the ontology or controlled vocabulary.
        range: date
        slot_uri: mim:OntologySource_release_date

      homepage:
        description: Homepage of the ontology or controlled vocabulary.
        range: uri
        slot_uri: mim:OntologySource_homepage

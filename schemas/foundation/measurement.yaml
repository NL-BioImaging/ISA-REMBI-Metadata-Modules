id: https://w3id.org/mim/schemas/foundation/measurement
name: mim_foundation_measurement
title: MIM measurement
description: Typed measurement recorded during a process.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- ontology_term
- value
- attribution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: measurement
  profile: foundation

classes:
  MIMMeasurement:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      measurement_type:
        range: MIMOntologyTerm
        slot_uri: mim:Measurement_measurement_type
      measured_value:
        range: MIMValue
        slot_uri: mim:Measurement_measured_value
        inlined: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:Measurement_attribution
        inlined: true

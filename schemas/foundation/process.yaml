id: https://w3id.org/mim/schemas/foundation/process
name: mim_foundation_process
title: MIM process
description: Execution record linking a protocol, agents, inputs, outputs, parameter values, 
  and measurements.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/
  
imports:
- linkml:types
- common
- protocol
- agent
- material
- data_file
- parameter_value
- measurement
- attribution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: process
  profile: foundation

classes:
  MIMProcess:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      protocol:
        range: MIMProtocol
        slot_uri: mim:Process_protocol
      performers:
        range: MIMAgent
        slot_uri: mim:Process_performers
        multivalued: true
      performed_on:
        range: datetime
        slot_uri: mim:Process_performed_on
      input_materials:
        range: MIMMaterial
        slot_uri: mim:Process_input_materials
        multivalued: true
      output_materials:
        range: MIMMaterial
        slot_uri: mim:Process_output_materials
        multivalued: true
      input_data:
        range: MIMDataFile
        slot_uri: mim:Process_input_data
        multivalued: true
      output_data:
        range: MIMDataFile
        slot_uri: mim:Process_output_data
        multivalued: true
      parameter_values:
        range: MIMParameterValue
        slot_uri: mim:Process_parameter_values
        multivalued: true
        inlined: true
      measurements:
        range: MIMMeasurement
        slot_uri: mim:Process_measurements
        multivalued: true
        inlined: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:Process_attribution
        inlined: true

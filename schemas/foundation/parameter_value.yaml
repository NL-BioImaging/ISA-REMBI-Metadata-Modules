id: https://w3id.org/mim/schemas/foundation/parameter_value
name: mim_foundation_parameter_value
title: MIM parameter value
description: Assigned value for a parameter specification.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org

imports:
- linkml:types
- common
- parameter_specification
- value
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: parameter_value
  profile: foundation

classes:
  MIMParameterValue:
    mixins:
    - MIMIdentifiedMixin
    extra_slots:
      allowed: true
    attributes:
      specification:
        range: MIMParameterSpecification
        slot_uri: mim:ParameterValue_specification
        required: true
      assigned_value:
        range: MIMValue
        slot_uri: mim:ParameterValue_assigned_value
        required: true
        inlined: true

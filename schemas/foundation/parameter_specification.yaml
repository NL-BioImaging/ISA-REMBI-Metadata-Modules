id: https://w3id.org/mim/schemas/foundation/parameter_specification
name: mim_foundation_parameter_specification
title: MIM parameter specification
description: Definition of a protocol or process parameter.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- ontology_term
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: parameter_specification
  profile: foundation

classes:
  MIMParameterSpecification:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      parameter_term:
        range: MIMOntologyTerm #check whether the parameter term is an ontology term
        slot_uri: mim:ParameterSpecification_parameter_term
      unit:
        range: MIMOntologyTerm #check whether the unit is an ontology term
        slot_uri: mim:ParameterSpecification_unit

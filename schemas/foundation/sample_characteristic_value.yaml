id: https://w3id.org/mim/schemas/foundation/sample_characteristic_value
name: mim_foundation_sample_characteristic_value
title: MIM sample characteristic value
description: Assigned value for a sample characteristic.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- sample_characteristic_definition
- value
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: sample_characteristic_value
  profile: foundation

classes:
  MIMSampleCharacteristicValue:
    mixins:
    - MIMIdentifiedMixin
    extra_slots:
      allowed: true
    attributes:
      definition:
        range: MIMSampleCharacteristicDefinition
        slot_uri: mim:SampleCharacteristicValue_definition
        required: true
        inlined: true
      assigned_value:
        range: MIMValue
        slot_uri: mim:SampleCharacteristicValue_assigned_value
        required: true
        inlined: true

id: https://w3id.org/mim/schemas/foundation/sample
name: mim_foundation_sample
title: MIM sample
description: Biological or experimental sample.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- material
- organism
- sample_characteristic_value
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: sample
  profile: foundation

classes:
  MIMSample:
    class_uri: jerm:Sample
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    is_a: MIMMaterial
    extra_slots:
      allowed: true
    attributes:
      derived_from:
        description: Material from which the sample was derived.
        range: MIMMaterial
        slot_uri: jerm:isDerivedFrom
        multivalued: true
      organism:
        description: Organism associated with the sample.
        range: MIMOrganism
        slot_uri: mim:Sample_organism
      characteristics:
        description: Characteristic values recorded for the sample.
        range: MIMSampleCharacteristicValue
        slot_uri: mim:Sample_characteristics
        multivalued: true
        inlined: true
        inlined_as_list: true

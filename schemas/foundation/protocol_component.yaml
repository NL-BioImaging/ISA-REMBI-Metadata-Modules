id: https://w3id.org/mim/foundation/protocol_component
name: mim_foundation_protocol_component
title: MIM protocol component
description: Abstract type-designated protocol component.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- common
- parameter_specification
default_prefix: mim
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  sh: http://www.w3.org/ns/shacl#
  prov: http://www.w3.org/ns/prov#
  orcid: https://orcid.org/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  namespace_status: provisional
  ecosystem_name: Multiomics and Imaging Metadata (MIM)
  semantic_basis: JERM
  module_name: protocol_component
  profile: foundation
classes:
  MIMProtocolComponent:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    abstract: true
    extra_slots:
      allowed: true
    attributes:
      component_type:
        range: string
        slot_uri: mim:MIMProtocolComponent_component_type
        designates_type: true
        required: true
      parameters:
        range: MIMParameterSpecification
        slot_uri: mim:MIMProtocolComponent_parameters
        multivalued: true

id: https://w3id.org/mim/schemas/foundation/model
name: mim_foundation_model
title: MIM model
description: Model research asset.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- asset
- file_format
- data_file
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: model
  profile: foundation

classes:
  MIMModel:
    class_uri: jerm:Model
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    is_a: MIMAsset
    slot_usage:
      asset_type:
        equals_string: model
    extra_slots:
      allowed: true
    attributes:
      model_format:
        range: MIMFileFormat
        slot_uri: jerm:hasFormat
        annotations:
          jerm_range: jerm:Model_format
          mim_range_adaptation: MIMFileFormat
      source_files:
        range: MIMDataFile
        slot_uri: mim:Model_source_files
        multivalued: true

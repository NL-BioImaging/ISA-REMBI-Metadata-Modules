id: https://w3id.org/mim/schemas/foundation/software_component
name: mim_foundation_software_component
title: MIM software component
description: Software Component subtype.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- protocol_component
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: software_component
  profile: foundation

classes:
  MIMSoftwareComponent:
    is_a: MIMProtocolComponent
    slot_usage:
      component_type:
        equals_string: MIMSoftwareComponent
    extra_slots:
      allowed: true
    attributes:
      manufacturer:
        range: string
        slot_uri: mim:SoftwareComponent_manufacturer
      repository_url:
        range: uri
        slot_uri: mim:SoftwareComponent_repository_url

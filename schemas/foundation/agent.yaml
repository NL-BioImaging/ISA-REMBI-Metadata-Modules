id: https://w3id.org/mim/schemas/foundation/agent
name: mim_foundation_agent
title: MIM agent
description: Agent participating in  metadata.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- institution
- role
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: agent
  profile: foundation

classes:
  MIMAgent:
    mixins:
    - MIMIdentifiedMixin
    - MIMDescribedMixin
    - MIMCommentedMixin
    extra_slots:
      allowed: true
    attributes:
      agent_type:
        range: AgentTypeEnum
        slot_uri: mim:Agent_agent_type
        required: true
      first_name:
        range: string
        slot_uri: mim:Agent_first_name
      middle_name:
        range: string
        slot_uri: mim:Agent_middle_name
      last_name:
        range: string
        slot_uri: mim:Agent_last_name
      orcid:
        range: uriorcurie
        slot_uri: mim:Agent_orcid
      email:
        range: string
        pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
        slot_uri: mim:Agent_email
      affiliations:
        range: MIMInstitution
        slot_uri: mim:Agent_affiliations
        multivalued: true
      roles:
        range: MIMOntologyAnnotation #check whether the role is an ontology term
        slot_uri: mim:Agent_roles
        multivalued: true
        required: true

enums:
  AgentTypeEnum:
    permissible_values:
      person: {}
      organization: {}
      group: {}
      software: {}
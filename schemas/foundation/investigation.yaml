id: https://w3id.org/mim/schemas/foundation/investigation
name: mim_foundation_investigation
title: MIM investigation
description: JERM-aligned investigation grouping studies.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- study
- publication
- funding
- attribution
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: investigation
  profile: foundation

classes:
  MIMInvestigation:
    class_uri: jerm:Investigation
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      studies:
        range: MIMStudy
        slot_uri: mim:Investigation_studies
        multivalued: true
      publications:
        range: MIMPublication
        slot_uri: mim:Investigation_publications
        multivalued: true
      funding:
        range: MIMFunding
        slot_uri: mim:Investigation_funding
        multivalued: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:Investigation_attribution
        inlined: true

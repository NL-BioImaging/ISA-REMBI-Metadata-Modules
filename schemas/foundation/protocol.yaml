id: https://w3id.org/mim/schemas/foundation/protocol
name: mim_foundation_protocol
title: MIM protocol
description: Reusable protocol description.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- asset
- ontology_term
- protocol_component
- parameter_specification
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: protocol
  profile: foundation

classes:
  MIMProtocol:
    class_uri: jerm:Protocol
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    is_a: MIMAsset
    slot_usage:
      asset_type:
        equals_string: protocol
    extra_slots:
      allowed: true
    attributes:
      protocol_type:
        range: MIMOntologyTerm #check whether the protocol type is an ontology term
        slot_uri: mim:Protocol_protocol_type
      components:
        range: MIMProtocolComponent
        slot_uri: mim:Protocol_components
        multivalued: true
        inlined: true
        inlined_as_list: true
      parameters:
        range: MIMParameterSpecification
        slot_uri: mim:Protocol_parameters
        multivalued: true
        inlined: true
        inlined_as_list: true

id: https://w3id.org/mim/schemas/foundation/institution
name: mim_foundation_institution
title: MIM institution
description: Institution participating in a project or attribution.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: institution
  profile: foundation

classes:
  MIMInstitution:
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    extra_slots:
      allowed: true
    attributes:
      ror:
        range: uriorcurie
        slot_uri: mim:Institution_ror
      address:
        range: string
        slot_uri: mim:Institution_address
      web_page:
        range: uri
        slot_uri: mim:Institution_web_page

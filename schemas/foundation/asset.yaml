id: https://w3id.org/mim/schemas/foundation/asset
name: mim_foundation_asset
title: MIM research asset
description: Abstract JERM-aligned research-asset.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- common
- attribution
- license
- external_reference
- assay
- project
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: asset
  profile: foundation

classes:
  MIMAsset:
    class_uri: jerm:Asset
    annotations:
      alignment_status: JERM_aligned_with_mim_extensions
    description: all shareable entities in the SEEK are kinds of Assets
    mixins:
    - MIMIdentifiedMixin
    - MIMNamedMixin
    - MIMDescribedMixin
    - MIMVersionedMixin
    - MIMCommentedMixin
    abstract: true
    extra_slots:
      allowed: true
    attributes:
      asset_type:
        range: AssetTypeEnum
        slot_uri: mim:Asset_type
        designates_type: true
        required: true
      license:
        range: MIMLicense
        slot_uri: mim:Asset_license
      external_references:
        range: MIMExternalReference
        slot_uri: mim:Asset_external_references
        multivalued: true
        inlined: true
        inlined_as_list: true
      attribution:
        range: MIMAttribution
        slot_uri: mim:Asset_attribution
        inlined: true
      assay:
        range: MIMAssay
        slot_uri: mim:Asset_assay
      produced_by_project:
        range: MIMProject
        slot_uri: mim:Asset_produced_by_project
      seek_id:
        range: uriorcurie
        slot_uri: mim:Asset_seek_id


enums:
  AssetTypeEnum:
    permissible_values:
      data: {}
      data_file: {}
      document: {}
      publication: {}
      presentation: {}
      workflow: {}
      model: {}
      protocol: {}
      sop: {}
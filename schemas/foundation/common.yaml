id: https://w3id.org/mim/schemas/foundation/common
name: mim_foundation_common
title: MIM common mixins
description: Shared local mixins for identifier, name, and description.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: common
  profile: foundation

classes:
  MIMIdentifiedMixin:
    mixin: true
    attributes:
      id:
        range: uriorcurie
        slot_uri: mim:IdentifiedMixin_id
        identifier: true
        required: true
  MIMNamedMixin:
    mixin: true
    attributes:
      title:
        range: string
        slot_uri: mim:NamedMixin_title
  MIMDescribedMixin:
    mixin: true
    attributes:
      description:
        range: string
        slot_uri: mim:DescribedMixin_description
  MIMCommentedMixin:
    mixin: true
    attributes:
      comments:
        range: string
        multivalued: true
        slot_uri: mim:CommentedMixin_comment
  MIMVersionedMixin:
    mixin: true
    attributes:
      version:
        range: string
        slot_uri: mim:VersionedMixin_version

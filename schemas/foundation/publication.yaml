id: https://w3id.org/mim/schemas/foundation/publication
name: mim_foundation_publication
title: MIM publication
description: Publication represented as a JERM research asset.
version: 1.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mim: https://w3id.org/mim/
  jerm: http://jermontology.org/ontology/JERMOntology#
  orcid: https://orcid.org/

imports:
- linkml:types
- agent
- asset
default_prefix: mim
default_range: string

created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  semantic_basis: JERM
  module_name: publication
  profile: foundation

classes:
  MIMPublication:
    class_uri: jerm:Publication
    annotations:
      alignment_status: JERM_ALIGNED_WITH_MIM_EXTENSIONS
    is_a: MIMAsset
    slot_usage:
      asset_type:
        equals_string: publication
    extra_slots:
      allowed: true
    attributes:
      authors:
        range: MIMAgent
        slot_uri: mim:Publication_authors
        multivalued: true
      publication_year:
        range: integer
        slot_uri: mim:Publication_publication_year
      journal:
        range: string
        slot_uri: mim:Publication_journal
      web_page:
        range: uri
        slot_uri: mim:Publication_web_page

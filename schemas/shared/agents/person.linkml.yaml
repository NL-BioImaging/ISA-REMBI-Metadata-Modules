id: https://example.org/schemas/shared/agents/person
name: person_schema
description: Reusable person metadata class for shared use across annotation groups
version: v1.0.0
license: https://creativecommons.org/licenses/by/4.0/

imports:
  - linkml:types
  - ../ontology/ontology_annotation
  - ./organisation

default_range: string

prefixes:
  orcid: https://orcid.org/

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC ; ACDC
  maintainer_note: Initial draft for modular bioimaging metadata schema
  semantic_scope: JERM Person + ISA Contact
  annotation_group: shared
  module_name: person
  metadata_profile_source: JERM/SEEK + ISA
  maintainer_note: Reusable person class for investigation, study, and assay modules

classes:

  Person:
    description: Reusable person metadata entity
    attributes:

      orcid:
        description: ORCID of the person, if available
        required: false
        range: uriorcurie
        aliases:
          - orcid
          - identifier
          - person_identifier

      first_name:
        description: First name of the person
        required: true
        range: string
        aliases:
          - first_name

      last_name:
        description: Last name of the person
        required: true
        range: string
        aliases:
          - last_name

      mid_initials:
        description: Middle initials of the person
        required: false
        range: string
        aliases:
          - mid_initials
          - middle_initials
          - initials

      email:
        description: Email address of the person
        required: false
        range: string
        aliases:
          - email

      phone:
        description: Phone number of the person
        required: false
        range: string
        aliases:
          - phone

      affiliation:
        description: Organisations or institutions with which the person is affiliated
        required: false
        multivalued: true
        range: Organisation
        inlined: true
        inlined_as_list: true
        aliases:
          - affiliation
          - affiliations
          - organisation_references

      web_page:
        description: Web page associated with the person
        required: false
        range: uri
        aliases:
          - web_page

      roles:
        description: Roles of the person, preferably expressed as ontology annotations
        required: false
        multivalued: true
        range: OntologyAnnotation
        inlined_as_list: true
        aliases:
          - roles

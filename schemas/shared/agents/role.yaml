id: https://example.org/schemas/shared/agents/role
name: role
description: JERM-aligned role component for person-organisation-role relationships.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/

imports:
- linkml:types
- ../../shared/mixins/common
- ../../shared/ontology/ontology_annotation

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.

classes:
  Role:
    description: Role held by a person or organisation in an investigation, study, assay or dataset.
    extra_slots:
      allowed: true
    attributes:
      role_id:
        description: URI or CURIE identifier for the role, if available.
        required: false
        range: uriorcurie
        identifier: true
      role_name:
        description: Human-readable role name.
        required: true
        range: string
        aliases:
        - Author/role
        - role
      role_term:
        description: Ontology term describing the role.
        required: false
        range: SharedOntologyAnnotation
        inlined: true

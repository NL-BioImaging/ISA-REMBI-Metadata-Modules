id: https://example.org/schemas/shared/references/publication
name: publication
description: Publication component aligned with JERM/SEEK publication assets, ISA publications and BIA publication metadata.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
- ../shared/mixins/common
- agents/person
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
classes:
  Publication:
    description: Publication associated with an investigation, study, dataset or result.
    extra_slots:
      allowed: true
    attributes:
      publication_id:
        description: URI or CURIE identifier for the publication.
        required: false
        range: uriorcurie
        identifier: true
      publication_title:
        description: Publication title.
        required: false
        range: string
        aliases:
        - Publication/title
        - publication title
      publication_authors:
        description: Authors of the publication.
        required: false
        range: Person
        multivalued: true
        inlined: true
        inlined_as_list: true
        aliases:
        - Publication/authors
        - Study/publications
      publication_doi:
        description: Digital Object Identifier for the publication.
        required: false
        range: string
        aliases:
        - Publication/doi
        - doi
      publication_year:
        description: Publication year.
        required: false
        range: integer
        aliases:
        - Publication/year
      publication_journal:
        description: Journal or venue of the publication
        required: false
        range: string
        aliases:
        - journal
      publication_pubmed_id:
        description: PubMed identifier for the publication.
        required: false
        range: string
        aliases:
        - Publication/pubmed_id
        - pubmed_id
      publication_url:
        description: URL for the publication.
        required: false
        range: uri

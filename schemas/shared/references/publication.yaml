id: https://example.org/schemas/shared/references/publication
name: publication_schema
description: Reusable publication metadata class for shared use across annotation groups
version: v1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
  - linkml:types
  - ../agents/person.linkml.yaml
default_range: string

prefixes:
  orcid: https://orcid.org/

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC ; ACDC
  semantic_scope: JERM Publication + ISA/BIA publication support
  annotation_group: shared
  module_name: publication
  metadata_profile_source: JERM/SEEK + ISA + BIA support fields
  maintainer_note: Reusable publication class for investigation and study modules

classes:
  Publication:
    description: Reusable publication metadata entity
    slots:
      - publication_identifier
      - title
      - pubmed_id
      - doi
      - authors
      - author_list
      - journal
      - publication_date
      - abstract
      - citation
      - publication_url
      - publication_type

slots:
  publication_identifier:
    description: Unique identifier for the publication
    required: true
    identifier: true
    aliases:
      - identifier

  title:
    description: Title of the publication
    required: true
    aliases:
      - title

  pubmed_id:
    description: PubMed identifier of the publication
    required: false
    aliases:
      - pubmed_id

  doi:
    description: DOI of the publication
    required: false
    aliases:
      - doi

  authors:
    description: Structured author references
    required: false
    multivalued: true
    range: Person
    aliases:
      - authors

  author_list:
    description: Free-text author list for the publication
    required: false
    aliases:
      - author_list

  journal:
    description: Journal or venue of the publication
    required: false
    aliases:
      - journal

  publication_date:
    description: Publication date
    required: false
    range: date
    aliases:
      - publication_date
      - year

  abstract:
    description: Abstract of the publication
    required: false
    multiline: true
    aliases:
      - abstract

  citation:
    description: Citation text for the publication
    required: false
    multiline: true
    aliases:
      - citation

  publication_url:
    description: URL of the publication
    required: false
    range: uri
    aliases:
      - url

  publication_type:
    description: Publication type
    required: false
    aliases:
      - publication_type
      - status

id: https://example.org/schemas/shared/references/funding
name: funding_schema
description: Reusable funding metadata class
version: v1.0.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
  - linkml:types
  - ./grant_reference.linkml.yaml
default_range: string

prefixes:
  orcid: https://orcid.org/

created_by: orcid:0000-0002-4904-3269

annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC ; ACDC
  semantic_scope: Funding support class
  annotation_group: shared
  module_name: funding
  metadata_profile_source: BIA/REMBI support fields
  maintainer_note: Reusable funding class for investigation and study modules

classes:
  Funding:
    description: Reusable funding metadata entity
    slots:
      - funding_identifier
      - funding_statement
      - funder_name
      - grant_references

slots:
  funding_identifier:
    description: Unique identifier for the funding record
    required: false
    identifier: true
    aliases:
      - identifier

  funding_statement:
    description: Free-text funding statement
    required: true
    multiline: true
    aliases:
      - funding_statement

  funder_name:
    description: Name of the funder
    required: false
    aliases:
      - funder
      - funder_name

  grant_references:
    description: References to grants associated with this funding item
    required: false
    multivalued: true
    range: GrantReference

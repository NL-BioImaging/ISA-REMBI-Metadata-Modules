id: https://example.org/schemas/shared/ontology/ontology_annotation
name: ontology_annotation
title: Shared ontology annotation
description: Reusable ontology annotation class for controlled terms and mappings.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/
imports:
- linkml:types
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  isa: http://purl.org/isaterms/
  jerm: http://jermontology.org/ontology/JERMOntology#
  edam: http://edamontology.org/
  orcid: https://orcid.org/
  prov: http://www.w3.org/ns/prov#
  obo: http://purl.obolibrary.org/obo/
created_by: orcid:0000-0002-4904-3269
annotations:
  created_by_name: Tooba Abbassi-Daloii
  created_by_affiliation: Amsterdam UMC; ACDC
  schema_status: draft
  design_note: Modular LinkML schema generated from JERM/SEEK, ISA/BIA alignment, REMBI and MIHCSME field inventories.
  semantic_scope: Shared controlled term representation
classes:
  SharedOntologyAnnotation:
    description: A controlled term or ontology annotation used across modules.
    class_uri: schema:DefinedTerm
    extra_slots:
      allowed: true
    attributes:
      term_id:
        description: URI or CURIE identifying the controlled term.
        required: false
        range: uriorcurie
        identifier: true
        aliases:
        - ontology_id
        - term_uri
      term_label:
        description: Human-readable label for the term.
        required: true
        range: string
        aliases:
        - ontology_name
        - term_name
        - label
      ontology_name:
        description: Name of the ontology or vocabulary from which the term was selected.
        required: false
        range: string
        aliases:
        - vocabulary_name
      ontology_version:
        description: Version of the ontology or vocabulary, if known.
        required: false
        range: string
      description:
        description: Free-text note explaining the selected term when needed.
        required: false
        range: string

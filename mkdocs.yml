site_name: Multi-omics and (bio)Imaging Metadata (MIM) Documentation
site_description: Interactive LinkML schema model browser and documentation for Multi-omics and (bio)Imaging Metadata (MIM) Modules.
site_url: https://nl-bioimaging.github.io/ISA-REMBI-Metadata-Modules/

repo_name: nl-bioimaging/mim
repo_url: https://github.com/nl-bioimaging/ISA-REMBI-Metadata-Modules

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

hooks:
  - scripts/build_docs_data.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Model Browser: model.md